<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:oklch(98% 0.004 95); --surface:oklch(99.5% 0.002 95); --surface-2:oklch(96.2% 0.006 95);
      --border:oklch(90% 0.008 95); --text:oklch(22% 0.02 265); --text-2:oklch(46% 0.02 265); --text-3:oklch(62% 0.015 265);
      --wm:oklch(58% 0.15 276); --wm-soft:oklch(94% 0.03 276); --on-accent:oklch(99% 0.004 276);
      --success:oklch(62% 0.14 150); --success-soft:oklch(95% 0.03 150);
      --radius-sm:10px; --radius-md:16px; --radius-lg:24px; --radius-full:999px;
      --font-display:'Sora',system-ui,sans-serif; --font-body:'Manrope',system-ui,sans-serif; --font-num:'Space Grotesk',system-ui,sans-serif;
    }
    [data-theme="dark"]{
      --bg:oklch(17% 0.012 265); --surface:oklch(21% 0.014 265); --surface-2:oklch(25% 0.016 265);
      --border:oklch(32% 0.018 265); --text:oklch(95% 0.006 265); --text-2:oklch(78% 0.012 265); --text-3:oklch(60% 0.014 265);
      --wm:oklch(74% 0.13 276); --wm-soft:oklch(30% 0.05 276); --on-accent:oklch(14% 0.02 276);
      --success:oklch(72% 0.13 150); --success-soft:oklch(30% 0.05 150);
    }
    *{box-sizing:border-box;}
    .chip{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:var(--radius-sm);background:var(--wm-soft);color:var(--wm);font-family:var(--font-num);font-weight:700;font-size:16px;}
    .tf{flex:1;padding:16px;border-radius:var(--radius-md);border:1.5px solid var(--border);background:var(--surface);font-family:var(--font-body);font-weight:700;font-size:15px;cursor:pointer;text-align:center;}
  </style>
</helmet>
<div class="la" data-theme="{{theme}}" style="width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;padding:20px 22px;">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="var(--text-3)" stroke-width="1.8" stroke-linecap="round"/></svg>
    <div style="display:flex;gap:6px;">
      <div style="width:26px;height:4px;border-radius:999px;background:var(--wm);"></div>
      <div style="width:26px;height:4px;border-radius:999px;background:var(--border);"></div>
      <div style="width:26px;height:4px;border-radius:999px;background:var(--border);"></div>
    </div>
    <div onClick="{{toggleTheme}}" style="width:18px;height:18px;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--text-3)" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="var(--text-3)" stroke-width="1.4"/></svg>
    </div>
  </div>
  <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 6px;">
    <div style="width:7px;height:7px;border-radius:999px;background:var(--wm);"></div>
    <div style="font-size:12.5px;font-weight:700;color:var(--wm);letter-spacing:.02em;">WORKING MEMORY · COMPLEX SPAN</div>
  </div>

  <div style="text-align:center;font-size:12.5px;color:var(--text-3);margin-bottom:6px;">Hold onto the letters — you'll recall them after</div>
  <div style="display:flex;justify-content:center;gap:10px;margin-bottom:36px;">
    <div class="chip">K</div>
    <div class="chip">R</div>
    <div class="chip">P</div>
    <div class="chip" style="background:var(--surface-2);color:var(--text-3);border:1.5px dashed var(--border);">?</div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <div style="font-size:13px;color:var(--text-3);margin-bottom:10px;">Is this true?</div>
    <div style="font-family:var(--font-num);font-weight:700;font-size:36px;margin-bottom:32px;">9 − 4 = 6</div>
    <div style="display:flex;gap:12px;width:100%;">
      <div class="tf" onClick="{{answer}}" style="{{trueStyle}}">True</div>
      <div class="tf" onClick="{{answer}}" style="{{falseStyle}}">False</div>
    </div>
    <div style="text-align:center;font-size:13px;color:var(--success);font-weight:700;height:20px;margin-top:16px;">{{feedback}}</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answered: false, dark: false };
  }
  renderVals() {
    const r = this.state.answered;
    return {
      trueStyle: r ? "border-color:var(--success);background:var(--success-soft);" : "",
      falseStyle: "",
      feedback: r ? "Correct — next letter coming up" : "",
      answer: () => { this.setState({ answered: true }); setTimeout(() => this.setState({ answered: false }), 900); },
      theme: this.state.dark ? "dark" : "light",
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
    };
  }
}
</script>
</body>
</html>
