<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:oklch(98% 0.004 95); --surface:oklch(99.5% 0.002 95); --surface-2:oklch(96.2% 0.006 95);
      --border:oklch(90% 0.008 95); --text:oklch(22% 0.02 265); --text-2:oklch(46% 0.02 265); --text-3:oklch(62% 0.015 265);
      --spatial:oklch(58% 0.10 195); --spatial-soft:oklch(94% 0.025 195); --on-accent:oklch(99% 0.004 276);
      --radius-sm:10px; --radius-md:16px; --radius-lg:24px; --radius-full:999px;
      --font-display:'Sora',system-ui,sans-serif; --font-body:'Manrope',system-ui,sans-serif; --font-num:'Space Grotesk',system-ui,sans-serif;
    }
    [data-theme="dark"]{
      --bg:oklch(17% 0.012 265); --surface:oklch(21% 0.014 265); --surface-2:oklch(25% 0.016 265);
      --border:oklch(32% 0.018 265); --text:oklch(95% 0.006 265); --text-2:oklch(78% 0.012 265); --text-3:oklch(60% 0.014 265);
      --spatial:oklch(72% 0.09 195); --spatial-soft:oklch(30% 0.04 195); --on-accent:oklch(14% 0.02 276);
    }
    *{box-sizing:border-box;}
    .cell{aspect-ratio:1;border-radius:var(--radius-md);background:var(--surface-2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font-num);font-weight:700;font-size:16px;color:var(--on-accent);}
  </style>
</helmet>
<div class="la" data-theme="{{theme}}" style="width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;padding:20px 22px;">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="var(--text-3)" stroke-width="1.8" stroke-linecap="round"/></svg>
    <div style="display:flex;gap:6px;">
      <div style="width:26px;height:4px;border-radius:999px;background:var(--spatial);"></div>
      <div style="width:26px;height:4px;border-radius:999px;background:var(--spatial);"></div>
      <div style="width:26px;height:4px;border-radius:999px;background:var(--border);"></div>
    </div>
    <div onClick="{{toggleTheme}}" style="width:18px;height:18px;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--text-3)" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="var(--text-3)" stroke-width="1.4"/></svg>
    </div>
  </div>
  <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 4px;">
    <div style="width:7px;height:7px;border-radius:999px;background:var(--spatial);"></div>
    <div style="font-size:12.5px;font-weight:700;color:var(--spatial);letter-spacing:.02em;">SPATIAL MEMORY · SEQUENCE RECALL</div>
  </div>
  <div style="text-align:center;font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:6px;">Tap the squares in the order they lit up</div>
  <div style="text-align:center;font-size:12.5px;color:var(--text-3);margin-bottom:28px;">Level 5 · {{tapCount}} of 6 tapped</div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;">
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px;width:250px;">
      <div class="cell" onClick="{{tap0}}" style="{{style0}}">{{order0}}</div>
      <div class="cell" onClick="{{tap1}}" style="{{style1}}">{{order1}}</div>
      <div class="cell" onClick="{{tap2}}" style="{{style2}}">{{order2}}</div>
      <div class="cell" onClick="{{tap3}}" style="{{style3}}">{{order3}}</div>
      <div class="cell" onClick="{{tap4}}" style="{{style4}}">{{order4}}</div>
      <div class="cell" onClick="{{tap5}}" style="{{style5}}">{{order5}}</div>
      <div class="cell" onClick="{{tap6}}" style="{{style6}}">{{order6}}</div>
      <div class="cell" onClick="{{tap7}}" style="{{style7}}">{{order7}}</div>
      <div class="cell" onClick="{{tap8}}" style="{{style8}}">{{order8}}</div>
    </div>
  </div>

  <button style="width:100%;padding:14px;margin-top:20px;background:var(--spatial);color:var(--on-accent);border:none;border-radius:var(--radius-full);font-family:var(--font-body);font-weight:700;font-size:14.5px;cursor:pointer;">Submit sequence</button>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { taps: [], dark: false };
  }
  tap(i) {
    if (this.state.taps.includes(i)) return;
    this.setState({ taps: [...this.state.taps, i] });
  }
  renderVals() {
    const taps = this.state.taps;
    const vals = {
      theme: this.state.dark ? "dark" : "light",
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
      tapCount: taps.length,
    };
    for (let i = 0; i < 9; i++) {
      const idx = taps.indexOf(i);
      vals["order" + i] = idx >= 0 ? String(idx + 1) : "";
      vals["style" + i] = idx >= 0 ? "background:var(--spatial);border-color:var(--spatial);" : "";
      vals["tap" + i] = (() => this.tap(i));
    }
    return vals;
  }
}
</script>
</body>
</html>
