<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:oklch(98% 0.004 95); --surface:oklch(99.5% 0.002 95); --surface-2:oklch(96.2% 0.006 95);
      --border:oklch(90% 0.008 95); --text:oklch(22% 0.02 265); --text-2:oklch(46% 0.02 265); --text-3:oklch(62% 0.015 265);
      --accent:oklch(56% 0.19 276); --accent-soft:oklch(94% 0.035 276); --on-accent:oklch(99% 0.004 276);
      --wm:oklch(58% 0.15 276); --wm-soft:oklch(94% 0.03 276);
      --reading:oklch(60% 0.15 68); --reading-soft:oklch(95% 0.035 68);
      --spatial:oklch(58% 0.10 195); --spatial-soft:oklch(94% 0.025 195);
      --radius-sm:10px; --radius-md:16px; --radius-lg:24px; --radius-full:999px;
      --shadow-card:0 1px 2px oklch(20% 0.02 265 / 0.05), 0 10px 28px oklch(20% 0.02 265 / 0.07);
      --font-display:'Sora',system-ui,sans-serif; --font-body:'Manrope',system-ui,sans-serif; --font-num:'Space Grotesk',system-ui,sans-serif;
    }
    [data-theme="dark"]{
      --bg:oklch(17% 0.012 265); --surface:oklch(21% 0.014 265); --surface-2:oklch(25% 0.016 265);
      --border:oklch(32% 0.018 265); --text:oklch(95% 0.006 265); --text-2:oklch(78% 0.012 265); --text-3:oklch(60% 0.014 265);
      --accent:oklch(74% 0.15 276); --accent-soft:oklch(32% 0.06 276); --on-accent:oklch(14% 0.02 276);
      --wm:oklch(74% 0.13 276); --wm-soft:oklch(30% 0.05 276);
      --reading:oklch(78% 0.13 75); --reading-soft:oklch(33% 0.06 75);
      --spatial:oklch(72% 0.09 195); --spatial-soft:oklch(30% 0.04 195);
      --shadow-card:0 1px 2px oklch(0% 0 0 / 0.35), 0 10px 28px oklch(0% 0 0 / 0.4);
    }
    *{box-sizing:border-box;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);}
    .row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);}
    .row:last-child{border-bottom:none;}
  </style>
</helmet>
<div class="la" data-theme="{{theme}}" style="width:390px;height:844px;overflow-y:auto;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;padding:32px 24px 28px;position:relative;">

  <div onClick="{{toggleTheme}}" style="position:absolute;top:24px;right:24px;width:28px;height:28px;border-radius:999px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--text-2)" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="4.2" stroke="var(--text-2)" stroke-width="1.6"/></svg>
  </div>

  <div style="text-align:center;margin-bottom:26px;">
    <div style="width:60px;height:60px;border-radius:999px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z" stroke="var(--accent)" stroke-width="1.4" fill="var(--accent)" fill-opacity="0.15"/></svg>
    </div>
    <div style="font-family:var(--font-display);font-weight:700;font-size:25px;">Session complete</div>
    <div style="font-size:13.5px;color:var(--text-2);margin-top:6px;">12 minutes · 3 exercises</div>
  </div>

  <div class="card" style="padding:18px 20px;margin-bottom:16px;">
    <div class="row">
      <div style="width:28px;height:28px;border-radius:8px;background:var(--wm-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="17" r="2" fill="var(--wm)"/><circle cx="12" cy="7" r="2" fill="var(--wm)"/><circle cx="18" cy="15" r="2" fill="var(--wm)"/></svg>
      </div>
      <div style="flex:1;font-size:13.5px;font-weight:600;">Spatial Sequence</div>
      <div style="font-family:var(--font-num);font-size:13.5px;font-weight:600;color:var(--text-2);">Lvl 4 → 5</div>
    </div>
    <div class="row">
      <div style="width:28px;height:28px;border-radius:8px;background:var(--reading-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 5.5c3-1.4 6-1.4 8 0v13c-2-1.4-5-1.4-8 0v-13z" stroke="var(--reading)" stroke-width="1.3"/><path d="M20 5.5c-3-1.4-6-1.4-8 0v13c2-1.4 5-1.4 8 0v-13z" stroke="var(--reading)" stroke-width="1.3"/></svg>
      </div>
      <div style="flex:1;font-size:13.5px;font-weight:600;">Reading</div>
      <div style="font-family:var(--font-num);font-size:13.5px;font-weight:600;color:var(--text-2);">268 → 281 WPM</div>
    </div>
    <div class="row">
      <div style="width:28px;height:28px;border-radius:8px;background:var(--spatial-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="7" cy="7" r="1.5" fill="var(--spatial)"/><circle cx="13" cy="7" r="1.5" fill="var(--spatial)"/><circle cx="7" cy="13" r="1.5" fill="var(--spatial)"/><circle cx="13" cy="13" r="1.5" fill="var(--spatial)"/></svg>
      </div>
      <div style="flex:1;font-size:13.5px;font-weight:600;">Complex Span</div>
      <div style="font-family:var(--font-num);font-size:13.5px;font-weight:600;color:var(--text-2);">7-item best</div>
    </div>
  </div>

  <div class="card" style="padding:18px 20px;margin-bottom:auto;display:flex;align-items:center;gap:12px;border-color:var(--accent);">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z" stroke="var(--accent)" stroke-width="1.3" fill="var(--accent-soft)"/></svg>
    <div style="font-size:13px;line-height:1.45;">You reached a new personal best on Spatial Sequence Recall — a 7-item sequence.</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;margin-top:22px;">
    <button style="width:100%;padding:15px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius-full);font-family:var(--font-body);font-weight:700;font-size:15px;cursor:pointer;">Done</button>
    <button style="width:100%;padding:13px;background:transparent;color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius-full);font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;">View progress</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: false };
  }
  renderVals() {
    return {
      theme: this.state.dark ? "dark" : "light",
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
    };
  }
}
</script>
</body>
</html>
