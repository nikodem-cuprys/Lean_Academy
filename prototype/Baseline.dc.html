<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:oklch(98% 0.004 95); --surface:oklch(99.5% 0.002 95);
      --border:oklch(90% 0.008 95); --text:oklch(22% 0.02 265); --text-2:oklch(46% 0.02 265); --text-3:oklch(62% 0.015 265);
      --accent:oklch(56% 0.19 276); --accent-soft:oklch(94% 0.035 276);
      --radius-md:16px; --radius-lg:24px; --radius-full:999px;
      --font-display:'Sora',system-ui,sans-serif; --font-body:'Manrope',system-ui,sans-serif;
    }
    [data-theme="dark"]{
      --bg:oklch(17% 0.012 265); --surface:oklch(21% 0.014 265);
      --border:oklch(32% 0.018 265); --text:oklch(95% 0.006 265); --text-2:oklch(78% 0.012 265); --text-3:oklch(60% 0.014 265);
      --accent:oklch(74% 0.15 276); --accent-soft:oklch(32% 0.06 276);
    }
    *{box-sizing:border-box;}
  </style>
</helmet>
<div class="la" data-theme="{{theme}}" style="width:390px;height:844px;overflow-y:auto;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;padding:24px;">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;">
    <div style="font-size:12.5px;font-weight:700;color:var(--text-3);letter-spacing:.03em;">QUICK CALIBRATION</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div onClick="{{toggleTheme}}" style="width:26px;height:26px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--text-2)" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="4.2" stroke="var(--text-2)" stroke-width="1.6"/></svg>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="var(--text-3)" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div style="text-align:center;margin-bottom:6px;">
    <div style="font-family:var(--font-display);font-weight:700;font-size:22px;">Watch, then repeat the pattern</div>
    <div style="font-size:13.5px;color:var(--text-2);margin-top:8px;line-height:1.5;max-width:280px;margin-left:auto;margin-right:auto;">About 90 seconds, no pass or fail — this just helps us start you at the right level.</div>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;">
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px;width:240px;">
      <div style="aspect-ratio:1;border-radius:var(--radius-md);background:var(--surface);border:1.5px solid var(--border);"></div>
      <div style="aspect-ratio:1;border-radius:var(--radius-md);background:var(--accent);box-shadow:0 0 0 6px var(--accent-soft);"></div>
      <div style="aspect-ratio:1;border-radius:var(--radius-md);background:var(--surface);border:1.5px solid var(--border);"></div>
      <div style="aspect-ratio:1;border-radius:var(--radius-md);background:var(--surface);border:1.5px solid var(--border);"></div>
      <div style="aspect-ratio:1;border-radius:var(--radius-md);background:var(--surface);border:1.5px solid var(--border);"></div>
      <div style="aspect-ratio:1;border-radius:var(--radius-md);background:var(--accent);box-shadow:0 0 0 6px var(--accent-soft);"></div>
      <div style="aspect-ratio:1;border-radius:var(--radius-md);background:var(--accent);box-shadow:0 0 0 6px var(--accent-soft);"></div>
      <div style="aspect-ratio:1;border-radius:var(--radius-md);background:var(--surface);border:1.5px solid var(--border);"></div>
      <div style="aspect-ratio:1;border-radius:var(--radius-md);background:var(--surface);border:1.5px solid var(--border);"></div>
    </div>
  </div>

  <div style="margin-top:24px;">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-bottom:8px;">
      <span>Question 3 of 6</span>
      <span>Memory &amp; comprehension both count</span>
    </div>
    <div style="height:5px;border-radius:999px;background:var(--border);overflow:hidden;">
      <div style="width:50%;height:100%;background:var(--accent);"></div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: false };
  }
  renderVals() {
    return {
      theme: this.state.dark ? "dark" : "light",
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
    };
  }
}
</script>
</body>
</html>
