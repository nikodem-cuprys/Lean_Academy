<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:oklch(98% 0.004 95); --surface:oklch(99.5% 0.002 95); --surface-2:oklch(96.2% 0.006 95);
      --border:oklch(90% 0.008 95); --text:oklch(22% 0.02 265); --text-2:oklch(46% 0.02 265); --text-3:oklch(62% 0.015 265);
      --wm:oklch(58% 0.15 276); --wm-soft:oklch(94% 0.03 276); --on-accent:oklch(99% 0.004 276);
      --radius-sm:10px; --radius-md:16px; --radius-lg:24px; --radius-full:999px;
      --font-display:'Sora',system-ui,sans-serif; --font-body:'Manrope',system-ui,sans-serif; --font-num:'Space Grotesk',system-ui,sans-serif;
    }
    [data-theme="dark"]{
      --bg:oklch(17% 0.012 265); --surface:oklch(21% 0.014 265); --surface-2:oklch(25% 0.016 265);
      --border:oklch(32% 0.018 265); --text:oklch(95% 0.006 265); --text-2:oklch(78% 0.012 265); --text-3:oklch(60% 0.014 265);
      --wm:oklch(74% 0.13 276); --wm-soft:oklch(30% 0.05 276); --on-accent:oklch(14% 0.02 276);
    }
    *{box-sizing:border-box;}
    .slot{width:42px;height:52px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:700;font-size:20px;}
    .slot.filled{border-color:var(--wm);background:var(--wm-soft);color:var(--wm);}
    .key{aspect-ratio:1;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-family:var(--font-num);font-weight:700;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  </style>
</helmet>
<div class="la" data-theme="{{theme}}" style="width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;padding:20px 22px;">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="var(--text-3)" stroke-width="1.8" stroke-linecap="round"/></svg>
    <div style="display:flex;gap:6px;">
      <div style="width:26px;height:4px;border-radius:999px;background:var(--wm);"></div>
      <div style="width:26px;height:4px;border-radius:999px;background:var(--border);"></div>
      <div style="width:26px;height:4px;border-radius:999px;background:var(--border);"></div>
    </div>
    <div onClick="{{toggleTheme}}" style="width:18px;height:18px;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--text-3)" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="var(--text-3)" stroke-width="1.4"/></svg>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 4px;">
    <div style="width:7px;height:7px;border-radius:999px;background:var(--wm);"></div>
    <div style="font-size:12.5px;font-weight:700;color:var(--wm);letter-spacing:.02em;">WORKING MEMORY · DIGIT SPAN</div>
  </div>
  <div style="text-align:center;font-family:var(--font-display);font-weight:700;font-size:19px;margin-bottom:4px;">Enter the numbers, in order</div>
  <div style="text-align:center;font-size:12.5px;color:var(--text-3);margin-bottom:28px;">Sequence length 5 · shown for 3 seconds</div>

  <div style="display:flex;justify-content:center;gap:10px;margin-bottom:36px;">
    <div class="slot {{f0}}">{{d0}}</div>
    <div class="slot {{f1}}">{{d1}}</div>
    <div class="slot {{f2}}">{{d2}}</div>
    <div class="slot {{f3}}">{{d3}}</div>
    <div class="slot {{f4}}">{{d4}}</div>
  </div>

  <div style="flex:1;"></div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin-bottom:14px;">
    <div class="key" onClick="{{k1}}">1</div><div class="key" onClick="{{k2}}">2</div><div class="key" onClick="{{k3}}">3</div>
    <div class="key" onClick="{{k4}}">4</div><div class="key" onClick="{{k5}}">5</div><div class="key" onClick="{{k6}}">6</div>
    <div class="key" onClick="{{k7}}">7</div><div class="key" onClick="{{k8}}">8</div><div class="key" onClick="{{k9}}">9</div>
    <div class="key" onClick="{{back}}" style="font-size:14px;color:var(--text-2);">⌫</div><div class="key" onClick="{{k0}}">0</div><div style="visibility:hidden;"></div>
  </div>

  <button style="width:100%;padding:15px;background:{{submitBg}};color:var(--on-accent);border:none;border-radius:var(--radius-full);font-family:var(--font-body);font-weight:700;font-size:15px;cursor:pointer;">Submit</button>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { digits: [], dark: false };
  }
  press(n) { if (this.state.digits.length < 5) this.setState({ digits: [...this.state.digits, n] }); }
  backspace() { this.setState({ digits: this.state.digits.slice(0, -1) }); }
  renderVals() {
    const d = this.state.digits;
    const vals = {
      theme: this.state.dark ? "dark" : "light",
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
      submitBg: d.length === 5 ? "var(--wm)" : "var(--border)",
      back: () => this.backspace(),
    };
    for (let i = 0; i < 5; i++) {
      vals["d" + i] = d[i] !== undefined ? String(d[i]) : "";
      vals["f" + i] = d[i] !== undefined ? "filled" : "";
    }
    for (let n = 0; n <= 9; n++) {
      vals["k" + n] = (() => this.press(n));
    }
    return vals;
  }
}
</script>
</body>
</html>
