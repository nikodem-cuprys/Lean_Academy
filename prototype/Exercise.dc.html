<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:oklch(98% 0.004 95); --surface:oklch(99.5% 0.002 95); --surface-2:oklch(96.2% 0.006 95);
      --border:oklch(90% 0.008 95); --text:oklch(22% 0.02 265); --text-2:oklch(46% 0.02 265); --text-3:oklch(62% 0.015 265);
      --wm:oklch(58% 0.15 276); --wm-soft:oklch(94% 0.03 276); --on-accent:oklch(99% 0.004 276);
      --success:oklch(62% 0.14 150); --success-soft:oklch(95% 0.03 150);
      --radius-sm:10px; --radius-md:16px; --radius-lg:24px; --radius-full:999px;
      --font-display:'Sora',system-ui,sans-serif; --font-body:'Manrope',system-ui,sans-serif;
    }
    [data-theme="dark"]{
      --bg:oklch(17% 0.012 265); --surface:oklch(21% 0.014 265); --surface-2:oklch(25% 0.016 265);
      --border:oklch(32% 0.018 265); --text:oklch(95% 0.006 265); --text-2:oklch(78% 0.012 265); --text-3:oklch(60% 0.014 265);
      --wm:oklch(74% 0.13 276); --wm-soft:oklch(30% 0.05 276); --on-accent:oklch(14% 0.02 276);
      --success:oklch(72% 0.13 150); --success-soft:oklch(30% 0.05 150);
    }
    *{box-sizing:border-box;}
    .cell{aspect-ratio:1;border-radius:var(--radius-md);background:var(--surface-2);border:1.5px solid var(--border);}
  </style>
</helmet>
<div class="la" data-theme="{{theme}}" style="width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;padding:20px 22px;">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="var(--text-3)" stroke-width="1.8" stroke-linecap="round"/></svg>
    <div style="display:flex;gap:6px;">
      <div style="width:26px;height:4px;border-radius:999px;background:var(--wm);"></div>
      <div style="width:26px;height:4px;border-radius:999px;background:var(--border);"></div>
      <div style="width:26px;height:4px;border-radius:999px;background:var(--border);"></div>
    </div>
    <div onClick="{{toggleTheme}}" style="width:18px;height:18px;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--text-3)" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="var(--text-3)" stroke-width="1.4"/></svg>
    </div>
  </div>
  <div style="text-align:center;font-size:12px;color:var(--text-3);margin-bottom:20px;">Exercise 1 of 3</div>

  <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;">
    <div style="width:7px;height:7px;border-radius:999px;background:var(--wm);"></div>
    <div style="font-size:12.5px;font-weight:700;color:var(--wm);letter-spacing:.02em;">WORKING MEMORY · SPATIAL SEQUENCE</div>
  </div>

  <div style="text-align:center;font-family:var(--font-display);font-weight:700;font-size:19px;margin-bottom:32px;">Tap the square if it matches 2 steps back</div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;">
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px;width:250px;">
      <div class="cell"></div>
      <div class="cell" style="background:var(--wm);border-color:var(--wm);box-shadow:0 0 0 7px var(--wm-soft);"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>
  </div>

  <div style="display:flex;justify-content:center;margin:28px 0 8px;">
    <button onClick="{{respond}}" style="width:84px;height:84px;border-radius:999px;background:{{btnBg}};color:var(--on-accent);border:none;font-family:var(--font-body);font-weight:700;font-size:14px;cursor:pointer;transition:transform .08s ease;">{{btnLabel}}</button>
  </div>
  <div style="text-align:center;font-size:12.5px;color:{{feedbackColor}};height:18px;font-weight:700;">{{feedback}}</div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { responded: false, dark: false };
  }
  renderVals() {
    const r = this.state.responded;
    return {
      btnBg: r ? "var(--success)" : "var(--wm)",
      btnLabel: r ? "Got it" : "Match",
      feedback: r ? "Correct — nice catch" : "",
      feedbackColor: "var(--success)",
      respond: () => { this.setState({ responded: true }); setTimeout(() => this.setState({ responded: false }), 900); },
      theme: this.state.dark ? "dark" : "light",
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
    };
  }
}
</script>
</body>
</html>
