<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:oklch(98% 0.004 95); --surface:oklch(99.5% 0.002 95); --surface-2:oklch(96.2% 0.006 95);
      --border:oklch(90% 0.008 95); --text:oklch(22% 0.02 265); --text-2:oklch(46% 0.02 265); --text-3:oklch(62% 0.015 265);
      --accent:oklch(56% 0.19 276); --accent-strong:oklch(46% 0.19 276); --accent-soft:oklch(94% 0.035 276); --on-accent:oklch(99% 0.004 276);
      --wm:oklch(58% 0.15 276); --wm-soft:oklch(94% 0.03 276);
      --reading:oklch(62% 0.16 75); --reading-soft:oklch(95% 0.04 75);
      --spatial:oklch(58% 0.10 195); --spatial-soft:oklch(94% 0.025 195);
      --caution:oklch(64% 0.19 35); --caution-soft:oklch(95% 0.045 35);
      --radius-sm:10px; --radius-md:16px; --radius-lg:24px; --radius-full:999px;
      --shadow-card:0 1px 2px oklch(20% 0.02 265 / 0.05), 0 10px 28px oklch(20% 0.02 265 / 0.07);
      --font-display:'Sora',system-ui,sans-serif; --font-body:'Manrope',system-ui,sans-serif; --font-num:'Space Grotesk',system-ui,sans-serif;
    }
    [data-theme="dark"]{
      --bg:oklch(17% 0.012 265); --surface:oklch(21% 0.014 265); --surface-2:oklch(25% 0.016 265);
      --border:oklch(32% 0.018 265); --text:oklch(95% 0.006 265); --text-2:oklch(78% 0.012 265); --text-3:oklch(60% 0.014 265);
      --accent:oklch(74% 0.15 276); --accent-strong:oklch(82% 0.13 276); --accent-soft:oklch(32% 0.06 276); --on-accent:oklch(14% 0.02 276);
      --wm:oklch(74% 0.13 276); --wm-soft:oklch(30% 0.05 276);
      --reading:oklch(78% 0.13 75); --reading-soft:oklch(33% 0.06 75);
      --spatial:oklch(72% 0.09 195); --spatial-soft:oklch(30% 0.04 195);
      --caution:oklch(74% 0.16 35); --caution-soft:oklch(34% 0.07 35);
      --shadow-card:0 1px 2px oklch(0% 0 0 / 0.35), 0 10px 28px oklch(0% 0 0 / 0.4);
    }
    *{box-sizing:border-box;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);}
    .navitem{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--text-3);flex:1;}
    .navitem.active{color:var(--accent);}
  </style>
</helmet>
<div class="la" data-theme="{{theme}}" style="width:390px;height:844px;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;">

  <div style="flex:1;overflow-y:auto;padding:20px 22px 12px;">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <div>
        <div style="font-family:var(--font-display);font-weight:700;font-size:21px;">Good morning, Alex</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div onClick="{{toggleTheme}}" style="width:30px;height:30px;border-radius:999px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--text-2)" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="4.2" stroke="var(--text-2)" stroke-width="1.6"/></svg>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2.5c1.2 3.4-2.6 4.4-2.6 7.6a2.6 2.6 0 005.2 0c0-.9-.6-1.8-.9-2.6 1.9 1 3.3 3 3.3 5.3a5.2 5.2 0 01-10.4 0c0-4.6 3.3-5.6 5.4-10.3z" stroke="var(--caution)" stroke-width="1.5" fill="var(--caution-soft)"/></svg>
        <span style="font-family:var(--font-num);font-weight:600;font-size:13.5px;color:var(--text-2);">8-day streak</span>
      </div>
      <div style="width:1px;height:14px;background:var(--border);"></div>
      <span style="font-family:var(--font-num);font-weight:600;font-size:13.5px;color:var(--text-2);">Training Level 12</span>
    </div>

    <div class="card" style="padding:24px;margin-bottom:20px;">
      <div style="font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.03em;margin-bottom:4px;">TODAY'S TRAINING</div>
      <div style="font-family:var(--font-display);font-weight:700;font-size:26px;margin-bottom:16px;">12 minutes</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:30px;height:30px;border-radius:9px;background:var(--wm-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="17" r="2" fill="var(--wm)"/><circle cx="12" cy="7" r="2" fill="var(--wm)"/><circle cx="18" cy="15" r="2" fill="var(--wm)"/></svg>
          </div>
          <div style="font-size:14px;font-weight:600;flex:1;">Working Memory</div>
          <div style="font-size:13px;color:var(--text-3);">4 min</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:30px;height:30px;border-radius:9px;background:var(--reading-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 5.5c3-1.4 6-1.4 8 0v13c-2-1.4-5-1.4-8 0v-13z" stroke="var(--reading)" stroke-width="1.4"/><path d="M20 5.5c-3-1.4-6-1.4-8 0v13c2-1.4 5-1.4 8 0v-13z" stroke="var(--reading)" stroke-width="1.4"/></svg>
          </div>
          <div style="font-size:14px;font-weight:600;flex:1;">Reading</div>
          <div style="font-size:13px;color:var(--text-3);">4 min</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:30px;height:30px;border-radius:9px;background:var(--spatial-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="7" cy="7" r="1.5" fill="var(--spatial)"/><circle cx="13" cy="7" r="1.5" fill="var(--spatial)"/><circle cx="7" cy="13" r="1.5" fill="var(--spatial)"/><circle cx="13" cy="13" r="1.5" fill="var(--spatial)"/></svg>
          </div>
          <div style="font-size:14px;font-weight:600;flex:1;">Spatial Memory</div>
          <div style="font-size:13px;color:var(--text-3);">4 min</div>
        </div>
      </div>
      <button style="width:100%;padding:15px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius-full);font-family:var(--font-body);font-weight:700;font-size:15.5px;cursor:pointer;">Start Training</button>
    </div>

    <div style="display:flex;gap:6px;margin-bottom:16px;">
      <div class="card" style="flex:1;padding:14px;">
        <div style="font-size:11px;font-weight:700;color:var(--text-3);margin-bottom:8px;">THIS WEEK</div>
        <div style="display:flex;gap:5px;">
          <div style="flex:1;height:22px;border-radius:5px;background:var(--accent);"></div>
          <div style="flex:1;height:22px;border-radius:5px;background:var(--accent);"></div>
          <div style="flex:1;height:22px;border-radius:5px;background:var(--accent);"></div>
          <div style="flex:1;height:22px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);"></div>
          <div style="flex:1;height:22px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);"></div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div style="width:34px;height:34px;border-radius:9px;background:var(--reading-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 5.5c3-1.4 6-1.4 8 0v13c-2-1.4-5-1.4-8 0v-13z" stroke="var(--reading)" stroke-width="1.4"/><path d="M20 5.5c-3-1.4-6-1.4-8 0v13c2-1.4 5-1.4 8 0v-13z" stroke="var(--reading)" stroke-width="1.4"/></svg>
      </div>
      <div>
        <div style="font-size:13.5px;font-weight:700;">Reading assessment</div>
        <div style="font-size:12px;color:var(--text-3);">In 3 days</div>
      </div>
    </div>

    <div class="card" style="padding:16px;display:flex;align-items:center;gap:12px;">
      <div style="width:34px;height:34px;border-radius:9px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z" stroke="var(--accent)" stroke-width="1.3" fill="var(--accent-soft)"/></svg>
      </div>
      <div>
        <div style="font-size:13.5px;font-weight:700;">First Week complete</div>
        <div style="font-size:12px;color:var(--text-3);">Earned yesterday</div>
      </div>
    </div>

  </div>

  <div style="display:flex;padding:12px 8px;border-top:1px solid var(--border);background:var(--surface);">
    <div class="navitem active"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.6"/></svg>Home</div>
    <div class="navitem"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Progress</div>
    <div class="navitem"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M9 3h6v4l3 8a2 2 0 01-1.9 2.7H7.9A2 2 0 016 14.9L9 7V3z" stroke="currentColor" stroke-width="1.6"/></svg>Science</div>
    <div class="navitem"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.4-3.6 4.2-5.5 7-5.5S18.6 16.4 20 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Profile</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: false };
  }
  renderVals() {
    return {
      theme: this.state.dark ? "dark" : "light",
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
    };
  }
}
</script>
</body>
</html>
