<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:oklch(98% 0.004 95); --surface:oklch(99.5% 0.002 95); --surface-2:oklch(96.2% 0.006 95);
      --border:oklch(90% 0.008 95); --text:oklch(22% 0.02 265); --text-2:oklch(46% 0.02 265); --text-3:oklch(62% 0.015 265);
      --wm:oklch(58% 0.15 276); --wm-soft:oklch(94% 0.03 276);
      --accent:oklch(56% 0.19 276); --on-accent:oklch(99% 0.004 276);
      --success:oklch(62% 0.14 150); --success-soft:oklch(95% 0.03 150);
      --radius-sm:10px; --radius-md:16px; --radius-lg:24px; --radius-full:999px;
      --shadow-card:0 1px 2px oklch(20% 0.02 265 / 0.05), 0 10px 28px oklch(20% 0.02 265 / 0.07);
      --font-display:'Sora',system-ui,sans-serif; --font-body:'Manrope',system-ui,sans-serif; --font-num:'Space Grotesk',system-ui,sans-serif;
    }
    [data-theme="dark"]{
      --bg:oklch(17% 0.012 265); --surface:oklch(21% 0.014 265); --surface-2:oklch(25% 0.016 265);
      --border:oklch(32% 0.018 265); --text:oklch(95% 0.006 265); --text-2:oklch(78% 0.012 265); --text-3:oklch(60% 0.014 265);
      --wm:oklch(74% 0.13 276); --wm-soft:oklch(30% 0.05 276);
      --accent:oklch(74% 0.15 276); --on-accent:oklch(14% 0.02 276);
      --success:oklch(72% 0.13 150); --success-soft:oklch(30% 0.05 150);
      --shadow-card:0 1px 2px oklch(0% 0 0 / 0.35), 0 10px 28px oklch(0% 0 0 / 0.4);
    }
    *{box-sizing:border-box;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);}
  </style>
</helmet>
<div class="la" data-theme="{{theme}}" style="width:390px;height:844px;overflow-y:auto;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;padding:28px 24px;">

  <div style="display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:18px;position:relative;">
    <div style="display:flex;gap:6px;">
      <div style="width:26px;height:4px;border-radius:999px;background:var(--wm);"></div>
      <div style="width:26px;height:4px;border-radius:999px;background:var(--border);"></div>
      <div style="width:26px;height:4px;border-radius:999px;background:var(--border);"></div>
    </div>
    <div onClick="{{toggleTheme}}" style="position:absolute;right:0;width:26px;height:26px;border-radius:999px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--text-2)" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="4.2" stroke="var(--text-2)" stroke-width="1.6"/></svg>
    </div>
  </div>

  <div style="text-align:center;margin-bottom:28px;">
    <div style="width:56px;height:56px;border-radius:999px;background:var(--success-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="font-family:var(--font-display);font-weight:700;font-size:23px;">Exercise complete</div>
    <div style="font-size:13.5px;color:var(--text-2);margin-top:6px;">Spatial Sequence Recall</div>
  </div>

  <div class="card" style="padding:22px;margin-bottom:16px;display:flex;justify-content:space-around;">
    <div style="text-align:center;">
      <div style="font-size:11.5px;color:var(--text-3);margin-bottom:4px;">ACCURACY</div>
      <div style="font-family:var(--font-num);font-weight:700;font-size:26px;">91%</div>
    </div>
    <div style="width:1px;background:var(--border);"></div>
    <div style="text-align:center;">
      <div style="font-size:11.5px;color:var(--text-3);margin-bottom:4px;">LEVEL</div>
      <div style="font-family:var(--font-num);font-weight:700;font-size:26px;">4 → 5</div>
    </div>
  </div>

  <div class="card" style="padding:18px 20px;margin-bottom:auto;">
    <div style="font-size:13.5px;color:var(--text-2);line-height:1.55;">Your accuracy held steady while difficulty increased — that's the sign to keep going, not just a faster pace.</div>
  </div>

  <button style="width:100%;padding:15px;margin-top:24px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius-full);font-family:var(--font-body);font-weight:700;font-size:15px;cursor:pointer;">Continue to Reading</button>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: false };
  }
  renderVals() {
    return {
      theme: this.state.dark ? "dark" : "light",
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
    };
  }
}
</script>
</body>
</html>
